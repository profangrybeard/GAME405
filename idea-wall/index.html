<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAME 405 · Idea Wall</title>
<style>
  :root {
    --ground: #101B2A;
    --tile:   #1E2E45;
    --edge:   #2C3E56;
    --cream:  #EAE6DC;
    --slate:  #8FA0B6;
    --amber:  #F0A93B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 40px 80px;
    background: var(--ground);
    color: var(--cream);
    font: 16px/1.5 "Inter", "Helvetica Neue", system-ui, -apple-system, sans-serif;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
    margin-bottom: 8px;
  }
  h1 { font-size: 34px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--slate); margin: 4px 0 32px; }
  .stats { display: flex; gap: 36px; }
  .stat b { display: block; font-size: 34px; color: var(--amber); line-height: 1.1; }
  .stat span { font-size: 12px; color: var(--slate); letter-spacing: 0.08em; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }
  figure { margin: 0; }
  figure img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    background: var(--tile);
    border: 1px solid var(--edge);
    border-radius: 6px;
  }
  figcaption { padding: 8px 2px 0; }
  .title { font-weight: 600; }
  .who { color: var(--slate); font-size: 14px; }
  .msg { color: var(--slate); padding: 40px 0; }
  a { color: inherit; text-decoration: none; }
  a:hover .title { color: var(--amber); }
</style>
</head>
<body>

<header>
  <div>
    <h1>The Idea Wall</h1>
    <p class="sub">Every idea this room pitched. Nothing thrown away.</p>
  </div>
  <div class="stats">
    <div class="stat"><b id="n-slides">0</b><span>PITCHED</span></div>
    <div class="stat"><b id="n-people">0</b><span>DESIGNERS</span></div>
  </div>
</header>

<div id="grid" class="grid"></div>
<p id="msg" class="msg">Loading.</p>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

fetch("manifest.json")
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(m => {
    const slides = m.slides || [];
    document.getElementById("n-slides").textContent = slides.length;
    document.getElementById("n-people").textContent =
      new Set(slides.map(s => s.student)).size;

    document.getElementById("grid").innerHTML = slides.map(s => `
      <figure>
        <a href="slides/${esc(s.file)}" target="_blank" rel="noopener">
          <img src="slides/${esc(s.file)}" alt="${esc(s.title)} by ${esc(s.name || s.student)}" loading="lazy">
          <figcaption>
            <div class="title">${esc(s.title || s.file)}</div>
            <div class="who">${esc(s.name || s.student)}</div>
          </figcaption>
        </a>
      </figure>`).join("");

    document.getElementById("msg").textContent =
      slides.length ? "" : "No slides published yet.";
  })
  .catch(() => {
    document.getElementById("msg").textContent =
      "Could not load manifest.json. Run the renderer and push.";
  });
</script>

</body>
</html>
